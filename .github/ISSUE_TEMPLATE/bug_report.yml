name: Bug report
description: Something produces wrong numbers, crashes, or contradicts the docs
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short, self-contained snippet. Synthetic data from `generate_prices(seed=...)` is ideal.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual output
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `python -c "import sys, numpy, pandas, backtest_reality_check as b; print(sys.version, numpy.__version__, pandas.__version__, b.__version__)"`
    validations:
      required: true
